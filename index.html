    <!-- Prevent benign development HMR WebSocket connection errors from triggering UI popups -->
    <script>
      (function() {
        if (window.location.hostname.includes('localhost') || window.location.hostname.includes('run.app') || window.location.hostname.includes('127.0.0.1')) {
          window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && (
              (event.reason.message && event.reason.message.includes('WebSocket')) ||
              (event.reason.message && event.reason.message.includes('websocket')) ||
              (event.reason.toString && event.reason.toString().includes('WebSocket')) ||
              (event.reason.toString && event.reason.toString().includes('websocket'))
            )) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
          window.addEventListener('error', function(event) {
            if (event.message && (
              event.message.includes('WebSocket') || 
              event.message.includes('websocket') ||
              event.message.includes('Failed to connect')
            )) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
        }
      })();
    </script>

    <!-- GitHub Pages Single Page App routing restoration -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
