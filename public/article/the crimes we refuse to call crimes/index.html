    <!-- Prevent benign development HMR WebSocket connection errors from triggering UI popups in preview iframe -->
    <script>
      (function() {
        // 1. Suppress console.error for benign Vite WebSocket HMR messages
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          var msg = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.message ? firstArg.message : String(firstArg || ''));
          if (msg.includes('failed to connect to websocket') || msg.includes('WebSocket closed without opened')) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        // 2. Suppress unhandled rejection events for benign WebSocket closure
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var reasonStr = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : String(reason || ''));
          if (reasonStr.includes('WebSocket') || reasonStr.includes('websocket')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        // 3. Suppress window error events for benign WebSocket closure
        window.addEventListener('error', function(event) {
          var msg = typeof event === 'string' ? event : (event.message || '');
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect to websocket')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
